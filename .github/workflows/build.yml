
name: Build Brader TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/brader/tv
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          test -f MainActivity.java
          test -f AndroidManifest.xml
          test -f index.html
          test -f stadium-wallpaper.png
          test -f styles.xml

          cp MainActivity.java app/src/main/java/com/brader/tv/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp index.html app/src/main/assets/index.html
          cp stadium-wallpaper.png app/src/main/assets/stadium-wallpaper.png
          cp styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.brader.tv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.brader.tv'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          echo "=== Android source files ==="
          find app/src/main -maxdepth 6 -type f -print | sort

          echo "=== Wallpaper size ==="
          wc -c app/src/main/assets/stadium-wallpaper.png

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak dijumpai"
            exit 1
          fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK assets
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/(index.html|stadium-wallpaper.png)'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: brader-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
